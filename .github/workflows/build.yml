name: build-usb-gadget-modules

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KSRC: ${{ github.workspace }}/kernel
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod python2 || sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio kmod

      # releases.linaro.org (GCC 7.5, the running kernel's compiler) is gone;
      # symbol CRCs come from the preprocessed source, so GCC 9 still matches.
      - name: Cross compiler (GCC 9)
        run: |
          sudo apt-get install -y gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p $HOME/xbin
          ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 $HOME/xbin/aarch64-linux-gnu-gcc
          echo "$HOME/xbin" >> $GITHUB_PATH

      - name: Kernel source (Iceows Phenix-4.9.337)
        run: git clone --depth 1 -b Phenix-4.9.337 https://github.com/Iceows/android_kernel_huawei_hi6250 "$KSRC"

      - name: Configure with the phone's own /proc/config.gz
        run: |
          cp phone.config "$KSRC/.config"
          cd "$KSRC"
          # Huawei left these headers out of the source drop; the options only
          # add debug counters and do not touch USB/net types.
          for opt in $(cat "$GITHUB_WORKSPACE/disable.txt"); do scripts/config --disable "$opt"; done
          make olddefconfig LOCALVERSION=
          grep -E 'CONFIG_LOCALVERSION=|CONFIG_MODVERSIONS|CONFIG_USB_U_ETHER' .config

      - name: Build kernel (for Module.symvers / CRCs)
        run: |
          cd "$KSRC"
          # Huawei vendor drivers in this drop do not build standalone (their
          # include paths come from Huawei's own build system). They are not
          # needed: only the CRCs of symbols exported by the core kernel, USB
          # gadget and net code are, and -k still compiles all of those.
          make -k -j"$(nproc)" LOCALVERSION= HOSTCFLAGS="-fcommon" KCFLAGS="-Wno-error" vmlinux > build.log 2>&1 || true
          grep -cE "fatal error:" build.log || true
          cat include/config/kernel.release
          for o in kernel/module.o drivers/usb/gadget/function/u_ether.o drivers/usb/gadget/composite.o net/core/dev.o; do ls -l "$o"; done

          # Module.symvers from the __crc_ symbols genksyms put in each object.
          find . -name '*.o' ! -name 'built-in.o' ! -path './scripts/*' ! -path './tools/*' -print0 \
            | xargs -0 aarch64-linux-gnu-nm 2>/dev/null \
            | awk '$3 ~ /^__crc_/ { v=$1; print "0x" substr(v, length(v)-7) "\t" substr($3, 7) "\tvmlinux\tEXPORT_SYMBOL" }' \
            | sort -u -k2,2 > Module.symvers
          wc -l Module.symvers
          grep -E "\s(gether_connect|gether_setup_name_default|usb_function_register|config_ep_by_speed|module_layout|alloc_etherdev_mqs)\s" Module.symvers

      - name: Build ECM / NCM gadget modules out of tree
        run: |
          cp "$KSRC"/drivers/usb/gadget/function/f_ecm.c module/
          cp "$KSRC"/drivers/usb/gadget/function/f_subset.c module/
          # Huawei's arm64 Makefile makes vdso_prepare depend on prepare0, which
          # does not exist for external (M=) builds; the vdso is already built.
          sed -i 's/^vdso_prepare: prepare0/vdso_prepare:/' "$KSRC/arch/arm64/Makefile"
          grep -n "vdso_prepare" "$KSRC/arch/arm64/Makefile" || true
          make -C "$KSRC" M="$PWD/module" LOCALVERSION= KCFLAGS="-Wno-error" modules 2>&1 | tee module.log
          ! grep -E "undefined!|has no CRC" module.log
          for m in module/*.ko; do echo "== $m"; modinfo "$m" | grep -E 'vermagic|depends|alias'; done
          grep -E 'gether_connect|usb_function_register|module_layout' "$KSRC/Module.symvers" || true
          mkdir -p out && cp module/*.ko out/ && cp "$KSRC/Module.symvers" out/
          sha256sum out/* > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: usb-gadget-modules
          path: out/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" out/* --title "$tag" --notes "ECM/NCM/subset gadget modules for 4.9.337-Phenix"
